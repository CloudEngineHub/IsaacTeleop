<text x="72" y="694" font-size="11" fill="#6B5220">Power the board from 3.3 V, never 5 V.&#160;&#160;CAN1 is on pins 33 / 37.</text>
<text x="72" y="712" font-size="10" fill="#8A7340">Pad order is schematic &#8212; match the silkscreen (TX / RX may read CTX / CRX).</text>
<text x="56" y="764" font-size="10.5" fill="#5A6472">Pin 17 is one of several 3.3 V pins (also 1); pin 30 is one of several grounds (6, 9, 14, 20, 25, 30, 34, 39).</text>
